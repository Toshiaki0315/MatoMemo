[package]
name = "matomemo"
version = "0.1.0"
description = "macOS 向けローカル思考整理ホワイトボードアプリ"
authors = ["Toshiaki Nomura"]
license = "MIT"
edition = "2021"

[lib]
name = "matomemo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# キー入力によるカーソルの自動隠蔽への対策 (NSCursor / NSEvent モニタ)
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", features = ["NSCursor", "NSEvent", "block2"] }
block2 = "0.6"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
